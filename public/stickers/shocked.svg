<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" fill="none">
  <!-- Shocked Kitten Peeking Over Border -->
  <g id="kitten-shocked">
    <!-- Fluffy Ears Bristled -->
    <path d="M 26 42 L 28 8 L 48 26 Z" fill="#94A3B8" stroke="#475569" stroke-width="2"/>
    <path d="M 31 38 L 33 14 L 45 26 Z" fill="#FDA4AF"/>
    <path d="M 94 42 L 92 8 L 72 26 Z" fill="#94A3B8" stroke="#475569" stroke-width="2"/>
    <path d="M 89 38 L 87 14 L 75 26 Z" fill="#FDA4AF"/>

    <!-- Head -->
    <ellipse cx="60" cy="50" rx="36" ry="30" fill="#E2E8F0" stroke="#475569" stroke-width="2"/>

    <!-- Wide Shocked Eyes -->
    <circle cx="44" cy="46" r="8" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/>
    <circle cx="44" cy="46" r="3.2" fill="#1E293B"/>
    <circle cx="76" cy="46" r="8" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/>
    <circle cx="76" cy="46" r="3.2" fill="#1E293B"/>

    <!-- Open "O" mouth -->
    <polygon points="58,54 62,54 60,57" fill="#FB7185"/>
    <ellipse cx="60" cy="62" rx="4.5" ry="6.5" fill="#FB7185" stroke="#475569" stroke-width="1.8"/>

    <!-- Sweat Drop -->
    <path d="M 94 36 C 94 33 91 29 91 29 C 91 29 88 33 88 36 C 88 38 91 40 94 36 Z" fill="#60A5FA"/>

    <!-- Whiskers -->
    <line x1="28" y1="56" x2="10" y2="52" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="28" y1="60" x2="12" y2="62" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="92" y1="56" x2="110" y2="52" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="92" y1="60" x2="108" y2="62" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Paws raised slightly -->
    <ellipse cx="36" cy="74" rx="8" ry="8" fill="#F8FAFC" stroke="#475569" stroke-width="2"/>
    <ellipse cx="84" cy="74" rx="8" ry="8" fill="#F8FAFC" stroke="#475569" stroke-width="2"/>
  </g>
</svg>
