<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" fill="none">
  <!-- Happy Purring Kitten Peeking Over Border -->
  <g id="kitten-happy">
    <!-- Fluffy Ears -->
    <path d="M 28 42 L 34 10 L 52 26 Z" fill="#94A3B8" stroke="#475569" stroke-width="2"/>
    <path d="M 33 38 L 38 16 L 49 26 Z" fill="#FDA4AF"/>
    <path d="M 92 42 L 86 10 L 68 26 Z" fill="#94A3B8" stroke="#475569" stroke-width="2"/>
    <path d="M 87 38 L 82 16 L 71 26 Z" fill="#FDA4AF"/>

    <!-- Head -->
    <ellipse cx="60" cy="50" rx="36" ry="30" fill="#E2E8F0" stroke="#475569" stroke-width="2"/>
    
    <!-- Tabby Stripes -->
    <path d="M 54 22 L 56 34" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
    <path d="M 60 20 L 60 35" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
    <path d="M 66 22 L 64 34" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>

    <!-- Happy Curved Closed Eyes ^ ^ -->
    <path d="M 38 48 Q 44 40 50 48" stroke="#1E293B" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 70 48 Q 76 40 82 48" stroke="#1E293B" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Blushing Cheeks -->
    <ellipse cx="36" cy="54" rx="5" ry="3.5" fill="#FDA4AF" opacity="0.8"/>
    <ellipse cx="84" cy="54" rx="5" ry="3.5" fill="#FDA4AF" opacity="0.8"/>

    <!-- Cute Smiling Mouth -->
    <polygon points="58,55 62,55 60,58" fill="#FB7185"/>
    <path d="M 54 58 Q 60 66 66 58 Z" fill="#FB7185" stroke="#475569" stroke-width="1.8"/>

    <!-- Whiskers -->
    <line x1="28" y1="56" x2="10" y2="52" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="28" y1="60" x2="12" y2="62" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="92" y1="56" x2="110" y2="52" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="92" y1="60" x2="108" y2="62" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Paws Resting on Board -->
    <ellipse cx="38" cy="80" rx="9" ry="7" fill="#F8FAFC" stroke="#475569" stroke-width="2"/>
    <ellipse cx="82" cy="80" rx="9" ry="7" fill="#F8FAFC" stroke="#475569" stroke-width="2"/>
  </g>
</svg>
